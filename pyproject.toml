# Hs — Higgins Decomposition
# Modern Python packaging metadata (PEP 621 + setuptools).
#
# This makes the engines (HCI-CNT/engine/cnt.py + HCI-CNQ/engine/cnq.py)
# pip-installable from a clean clone:
#
#   git clone https://github.com/PeterHiggins19/higgins-decomposition
#   cd higgins-decomposition
#   pip install -e .
#
# Then use:
#
#   python -m HCI_CNT.engine.cnt input.csv -o output.json
#   python -m HCI_CNQ.engine.cnq --cnt-json output.json --out cnq.json
#
# Or, without installation, just run from source:
#
#   python HCI-CNT/engine/cnt.py input.csv -o output.json
#   python HCI-CNQ/engine/cnq.py --cnt-json output.json --out cnq.json

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "higgins-decomposition"
version = "0.27.0"
description = "Higgins Decomposition (Hs): a deterministic compositional inference instrument with quaternion-native verification layer"
readme = "PUBLICATION_READY.md"
requires-python = ">=3.9"
authors = [
    { name = "Peter Higgins", email = "PeterHiggins@RogueWaveAudio.com" },
]
keywords = [
    "compositional-data-analysis",
    "aitchison-geometry",
    "simplex",
    "quaternion",
    "deterministic",
    "reproducibility",
    "ieee-754",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Optional packages used in some atlas / plate generators
plates = [
    "matplotlib>=3.4",
    "pandas>=1.3",
]

[project.urls]
Homepage = "https://github.com/PeterHiggins19/higgins-decomposition"
Repository = "https://github.com/PeterHiggins19/higgins-decomposition"
Documentation = "https://github.com/PeterHiggins19/higgins-decomposition/blob/main/PUBLICATION_READY.md"
"AI Loader" = "https://github.com/PeterHiggins19/higgins-decomposition/blob/main/HS_FAST_REFRESH.json"
Issues = "https://github.com/PeterHiggins19/higgins-decomposition/issues"
"Companion HUF Repo" = "https://github.com/PeterHiggins19/Higgins-Unity-Framework"

[project.scripts]
# Convenience CLI wrappers — these point at the canonical engines.
# After `pip install -e .`, users can run:
#
#   hs-cnt input.csv -o output.json
#   hs-cnq --cnt-json output.json --out cnq.json
#
# Without installation, run the engine scripts directly (see project README).
hs-cnt = "HCI_CNT.engine.cnt:main"
hs-cnq = "HCI_CNQ.engine.cnq:main"

[tool.setuptools]
# The repo is a research monorepo; we expose the two engine packages explicitly.
# Folder names with hyphens are aliased to underscored Python package names.
packages = []

[tool.setuptools.package-dir]
# Mapping for the engines that contain Python modules.
# The hyphenated folders HCI-CNT and HCI-CNQ are not valid Python package names,
# so users invoking via `import` should prefer the direct script form documented
# in PUBLICATION_READY.md until a future release reorganises the folder layout.
HCI_CNT = "HCI-CNT"
HCI_CNQ = "HCI-CNQ"

[tool.pytest.ini_options]
testpaths = [
    "HCI-CNQ/engine/tests",
    "HCI-CNT/engine/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
