  <text x="135" y="519" fill="#dff" font-size="11" text-anchor="middle">Instrument Proof</text>
  <text x="135" y="533" fill="#cfe" font-size="10" text-anchor="middle">GDoF 48 · CGS 1.68</text>

  <!-- Step 2 : CGS-2 -->
  <rect x="225" y="385" width="150" height="155" fill="#1b8a4a" stroke="#0b5" stroke-width="1.5"/>
  <text x="300" y="412" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">CGS-2</text>
  <text x="300" y="431" fill="#dff" font-size="11" text-anchor="middle">Cross-Domain</text>
  <text x="300" y="445" fill="#cfe" font-size="10" text-anchor="middle">GDoF 1,296 · CGS 3.11</text>

  <!-- Step 3 : CGS-3 -->
  <rect x="390" y="300" width="150" height="240" fill="#1b8a4a" stroke="#0b5" stroke-width="1.5"/>
  <text x="465" y="327" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">CGS-3</text>
  <text x="465" y="346" fill="#dff" font-size="11" text-anchor="middle">Operational</text>
  <text x="465" y="360" fill="#cfe" font-size="10" text-anchor="middle">GDoF 42,240 · CGS 4.63</text>

