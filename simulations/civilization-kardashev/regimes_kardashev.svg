  <text x="630" y="261" fill="#dfeeff" font-size="11" text-anchor="middle">Network Governance</text>
  <text x="630" y="276" fill="#cfe3ff" font-size="10" text-anchor="middle">GDoF 3.15M · CGS 6.50</text>
  <text x="630" y="295" fill="#9ec9ff" font-size="10.5" font-style="italic" text-anchor="middle">~ Kardashev I</text>
  <text x="630" y="309" fill="#9ec9ff" font-size="9.5" text-anchor="middle">govern the home domain</text>

  <!-- Step 5 : CGS-5 (gate / Kardashev V) -->
  <rect x="720" y="110" width="190" height="430" fill="#2a6fb0" stroke="#1d5e9c" stroke-width="1.5"/>
  <text x="815" y="140" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">CGS-5</text>
  <text x="815" y="160" fill="#dfeeff" font-size="11.5" text-anchor="middle">Universal Compositional</text>
  <text x="815" y="175" fill="#cfe3ff" font-size="10.5" text-anchor="middle">GDoF 109.4M · CGS 8.04</text>
  <text x="815" y="196" fill="#ffd479" font-size="12.5" font-weight="700" font-style="italic" text-anchor="middle">~ Kardashev V</text>
  <text x="815" y="212" fill="#ffe3a6" font-size="10" text-anchor="middle">govern complexity itself</text>

  <!-- the Hs bridge arrow from step4 to step5 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#ffd479"/>
