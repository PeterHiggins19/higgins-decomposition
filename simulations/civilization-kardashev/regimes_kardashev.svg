  <path d="M675,150 C700,120 705,118 718,116" fill="none" stroke="#ffd479" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="470" y="92" width="300" height="44" rx="6" fill="#1a1f27" stroke="#ffd479" stroke-width="1.2"/>
  <text x="620" y="110" fill="#ffd479" font-size="12.5" font-weight="700" text-anchor="middle">+ H&#770; governs the COUPLINGS</text>
  <text x="620" y="126" fill="#ffe3a6" font-size="10.5" text-anchor="middle">the relations between domains — the only path past CGS-4</text>

  <!-- the blocked "without Hs" cap on step 4 -->
  <rect x="540" y="430" width="182" height="44" rx="6" fill="#3a1416" stroke="#c0392b" stroke-width="1.2"/>
  <text x="631" y="449" fill="#ff9a8d" font-size="11" font-weight="700" text-anchor="middle">&#9940; without H&#770;: caps here</text>
  <text x="631" y="464" fill="#ffc4bb" font-size="9.5" text-anchor="middle">CGS 7.56 — governs systems, not couplings</text>

  <!-- footnote / fence -->
  <text x="40" y="588" fill="#6e7681" font-size="11">Honest fence: CGS is the source's own n=1 OPINION (levels designed, not derived); "Kardashev V" is an ANALOGY, not a physics/energy claim.</text>
  <text x="40" y="606" fill="#6e7681" font-size="11">Illustrative deterministic simulation (kardashev_projection.py). Peter is the sole gate; nothing posted.</text>
