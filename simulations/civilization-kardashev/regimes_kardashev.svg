<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#0e1117"/>
  <text x="40" y="44" fill="#e6edf3" font-size="26" font-weight="700">The regimes of projection — Compositional Governance Scale → Kardashev V</text>
  <text x="40" y="70" fill="#8b98a5" font-size="14">CGS = log&#8321;&#8320;(GDoF) · GDoF = &#931; (carriers&#8722;1)·sites·diagnostics·temporal · H&#770; governs the couplings that cross the top gate · receipt d2dbf604ac3beaca</text>

  <!-- baseline -->
  <line x1="50" y1="540" x2="930" y2="540" stroke="#30363d" stroke-width="2"/>

  <!-- Step 1 : CGS-1 -->
  <rect x="60" y="470" width="150" height="70" fill="#1b8a4a" stroke="#0b5" stroke-width="1.5"/>
