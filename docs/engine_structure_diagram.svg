<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CNT v3 + CNQ v2 engine structure — push #32 architecture</title>
  <desc id="desc">Two pillars: CNT v3 left, CNQ v2 right, sharing closure / CLR / Helmert / ILR upstream and producing independent canonical hashes downstream.</desc>

  <style>
    .bg { fill: #fafafa; }
    .stage-coda { fill: #eef4ff; stroke: #3b82f6; stroke-width: 1.5; }
    .stage-hs   { fill: #fef5e7; stroke: #f59e0b; stroke-width: 1.5; }
    .stage-shared { fill: #f4eeff; stroke: #a78bfa; stroke-width: 1.5; }
    .stage-hash { fill: #e6f9f1; stroke: #10b981; stroke-width: 1.5; }
    .stage-input { fill: #f0f0f0; stroke: #6b7280; stroke-width: 1.5; }
    .arrow { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .pillar-rule { stroke: #e6e7e9; stroke-width: 1; stroke-dasharray: 4 4; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #1a1a1a; }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 11px; fill: #6b7280; }
    .stage-name { font-size: 11px; font-weight: 600; }
    .formula { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; fill: #4b5563; }
    .legend-text { font-size: 10px; fill: #1a1a1a; }
    .pillar-label { font-size: 13px; font-weight: 700; }
    .pillar-tag { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #6b7280; }
    .pill-load { font-size: 9px; font-weight: 700; fill: #92400e; }
    .pill-future { font-size: 9px; font-weight: 700; fill: #6d28d9; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="920"/>

  <text class="title" x="20" y="30">Hs Engine Structure — CNT v3.0.0 + CNQ v2.0.0</text>
  <text class="subtitle" x="20" y="48">Push #32 · CoDa-community vocabulary · independent canonical hashes · domain wrappers translate · self-test receipts chain</text>

  <g transform="translate(20, 65)">
    <rect class="stage-coda" x="0" y="0" width="14" height="14" rx="2"/>
    <text class="legend-text" x="20" y="11">CoDa standard</text>
    <rect class="stage-hs" x="120" y="0" width="14" height="14" rx="2"/>
    <text class="legend-text" x="140" y="11">Higgins extension</text>
    <rect class="stage-shared" x="260" y="0" width="14" height="14" rx="2"/>
    <text class="legend-text" x="280" y="11">hci_shared module</text>
    <rect class="stage-hash" x="410" y="0" width="14" height="14" rx="2"/>
    <text class="legend-text" x="430" y="11">determinism hash</text>
    <rect class="stage-input" x="560" y="0" width="14" height="14" rx="2"/>
    <text class="legend-text" x="580" y="11">I/O</text>
  </g>

  <line class="pillar-rule" x1="600" y1="105" x2="600" y2="900"/>

  <g transform="translate(20, 105)">
    <text class="pillar-label" x="0" y="14">CNT v3.0.0 — Compositional Navigation Tensor</text>
    <text class="pillar-tag" x="430" y="14">schema 3.0.0</text>
  </g>
  <g transform="translate(620, 105)">
    <text class="pillar-label" x="0" y="14">CNQ v2.0.0 — Compositional Navigation Quaternion</text>
    <text class="pillar-tag" x="430" y="14">schema cnq/2.0.0</text>
  </g>

  <g transform="translate(20, 135)">
    <rect class="stage-input" x="0" y="0" width="560" height="42" rx="4"/>
    <text class="stage-name" x="10" y="16">ingest_csv → validate_rows</text>
    <text class="formula" x="10" y="32">strict UTF-8 · zero-replace · positivity · reject NaN/Inf · errors='strict'</text>
  </g>
  <path class="arrow" d="M 300 177 L 300 188"/>

  <g transform="translate(20, 190)">
    <rect class="stage-shared" x="0" y="0" width="560" height="42" rx="4"/>
    <text class="stage-name" x="10" y="16">closure(rows) — hci_shared.geometry</text>
    <text class="formula" x="10" y="32">x_i ↦ x_i / Σ x_j   (project onto simplex)</text>
  </g>
  <path class="arrow" d="M 300 232 L 300 243"/>

  <g transform="translate(20, 245)">
    <rect class="stage-shared" x="0" y="0" width="560" height="42" rx="4"/>
    <text class="stage-name" x="10" y="16">clr(rows_closed) — hci_shared.geometry</text>
    <text class="formula" x="10" y="32">h_i = log(x_i) − ⟨log x⟩   (closure-invariant; row sums = 0)</text>
  </g>
  <path class="arrow" d="M 300 287 L 300 298"/>

  <g transform="translate(20, 300)">
    <rect class="stage-shared" x="0" y="0" width="560" height="42" rx="4"/>
    <text class="stage-name" x="10" y="16">helmert_basis(D) → ILR — hci_shared.geometry</text>
    <text class="formula" x="10" y="32">H ∈ ℝ^(D-1×D), HHᵀ = I_(D-1);   ILR = clr · Hᵀ</text>
  </g>
  <path class="arrow" d="M 300 342 L 300 353"/>

  <g transform="translate(20, 355)">
    <rect class="stage-hs" x="0" y="0" width="560" height="58" rx="4"/>
    <text class="stage-name" x="10" y="16">compute_tensor_block — per-timestep</text>
    <text class="formula" x="10" y="32">κ^HS_ij = (δ_ij − 1/D) / (x_i x_j) · s_j = (1/x_j)/Σ(1/x_k) · σ_t = argmax_j |Δh_j|</text>
    <text class="formula" x="10" y="48">timesteps[].coda_standard ⊕ .higgins_extensions   (locked split)</text>
  </g>
  <path class="arrow" d="M 300 413 L 300 424"/>

  <g transform="translate(20, 426)">
    <rect class="stage-hs" x="0" y="0" width="560" height="58" rx="4"/>
    <text class="stage-name" x="10" y="16">stages 1 / 2 / 3 — analytic projections</text>
    <text class="formula" x="10" y="32">section atlas · variation matrix τ_ij = var(log x_i/x_j) · pair_examination</text>
    <text class="formula" x="10" y="48">triadic_area top-K · subcomposition_ladder · regime_detection</text>
  </g>
  <path class="arrow" d="M 300 484 L 300 495"/>

  <g transform="translate(20, 497)">
    <rect class="stage-hs" x="0" y="0" width="560" height="74" rx="4"/>
    <text class="stage-name" x="10" y="16">depth_tower — load-bearing diagnostic</text>
    <text class="formula" x="10" y="32">energy_levels[ ] · curvature_levels[ ]   (cumulative closure of squared deltas)</text>
    <text class="formula" x="10" y="48">fit_attractor: period · stability · dominant_pair · λ · A · ζ</text>
    <text class="formula" x="10" y="64">M(p)_j = (1/p_j)/Σ(1/p_k);   ‖M²p − p‖_∞ ≤ 10⁻¹⁰   (involution test)</text>
  </g>
  <path class="arrow" d="M 300 571 L 300 582"/>

  <g transform="translate(20, 584)">
    <rect class="stage-shared" x="0" y="0" width="560" height="42" rx="4"/>
    <text class="stage-name" x="10" y="16">compute_helmsman_family — hci_shared.helmsman</text>
    <text class="formula" x="10" y="32">σ · sign · flips · stability_S_σ · chaos_indicator · torque_proxy</text>
  </g>
  <path class="arrow" d="M 300 626 L 300 637"/>

  <g transform="translate(20, 639)">
    <rect class="stage-hs" x="0" y="0" width="560" height="42" rx="4"/>
    <text class="stage-name" x="10" y="16">diagnostics: eitt + lock_events + degeneracy_flags</text>
    <text class="formula" x="10" y="32">EITT M-sweep · CLR &lt; threshold lock · degeneracy heuristics</text>
  </g>
  <path class="arrow" d="M 300 681 L 300 692"/>

  <g transform="translate(20, 694)">
    <rect class="stage-hash" x="0" y="0" width="560" height="58" rx="4"/>
    <text class="stage-name" x="10" y="16">cnt_content_sha256 — determinism contract</text>
    <text class="formula" x="10" y="32">SHA-256(canonical-JSON(payload − {generated, wall_clock, environment, content_sha256}))</text>
    <text class="formula" x="10" y="48">independent of CNQ hash · within-Python byte-identical</text>
  </g>

  <!-- RIGHT PILLAR -->

  <g transform="translate(620, 135)">
    <rect class="stage-input" x="0" y="0" width="560" height="42" rx="4"/>
    <text class="stage-name" x="10" y="16">ingest_csv → validate_rows  (same strict ingest)</text>
    <text class="formula" x="10" y="32">native CSV producer; CNT JSON optional reference (not hash-chained)</text>
  </g>
  <path class="arrow" d="M 900 177 L 900 188"/>

  <g transform="translate(620, 190)">
    <rect class="stage-shared" x="0" y="0" width="560" height="58" rx="4"/>
    <text class="stage-name" x="10" y="16">closure → clr → helmert_basis → ILR — hci_shared.geometry</text>
    <text class="formula" x="10" y="32">identical pipeline to CNT — same Helmert, same orthonormality</text>
    <text class="formula" x="10" y="48">H @ Hᵀ = I_(D-1) verified to 4.44 × 10⁻¹⁶ (IEEE floor)</text>
  </g>
  <path class="arrow" d="M 900 248 L 900 259"/>

  <g transform="translate(620, 261)">
    <rect class="stage-hs" x="0" y="0" width="560" height="74" rx="4"/>
    <text class="stage-name" x="10" y="16">classify_dimension(D) — policy classifier</text>
    <text class="formula" x="10" y="32">D=8: twin_quaternion_native</text>
    <text class="pill-load" x="160" y="32">LOAD-BEARING</text>
    <text class="formula" x="10" y="48">D=16: quad_quaternion_native_future</text>
    <text class="pill-future" x="180" y="48">v2.1</text>
    <text class="formula" x="10" y="64">D=4 single  ·  D=3 zpad  ·  D=2 bearing-only  ·  D=5..15(≠8) reduced</text>
  </g>
  <path class="arrow" d="M 900 335 L 900 346"/>

  <g transform="translate(620, 348)">
    <rect class="stage-shared" x="0" y="0" width="560" height="74" rx="4"/>
    <text class="stage-name" x="10" y="16">bearing_trajectory — branch by D</text>
    <text class="formula" x="10" y="32">D=4: quaternion_sandwich_residuals — q_t = rotation_quaternion_between(u_t, u_(t+1))</text>
    <text class="formula" x="10" y="48">D=8: twin_quaternion_factor — q_A on [0,1,2], q_B on [3,4,5], residual axis 6</text>
    <text class="formula" x="10" y="64">residual = ‖q v q* − v_next‖_∞ ≈ 4.44 × 10⁻¹⁶ (each factor)</text>
  </g>
  <path class="arrow" d="M 900 422 L 900 433"/>

  <g transform="translate(620, 435)">
    <rect class="stage-hs" x="0" y="0" width="560" height="58" rx="4"/>
    <text class="stage-name" x="10" y="16">radial_trajectory — first-class output (v1 discarded; v2 emits)</text>
    <text class="formula" x="10" y="32">‖ILR_t‖₂ per step; min/max/mean/median/std</text>
    <text class="formula" x="10" y="48">complement to bearing — together = full ILR trajectory recoverable</text>
  </g>
  <path class="arrow" d="M 900 493 L 900 504"/>

  <g transform="translate(620, 506)">
    <rect class="stage-shared" x="0" y="0" width="560" height="58" rx="4"/>
    <text class="stage-name" x="10" y="16">helmsman_family + attractor_fit — same shared modules as CNT</text>
    <text class="formula" x="10" y="32">σ · sign · flips · S_σ · chaos · torque   (helmsman family)</text>
    <text class="formula" x="10" y="48">period · stability · dominant_pair · λ · A · ζ   (attractor fit)</text>
  </g>
  <path class="arrow" d="M 900 564 L 900 575"/>

  <g transform="translate(620, 577)">
    <rect class="stage-shared" x="0" y="0" width="560" height="74" rx="4"/>
    <text class="stage-name" x="10" y="16">chsh_S_value(q_A, q_B) — D=8 only — hci_shared.factoring</text>
    <text class="formula" x="10" y="32">analyzers: a, a' = 0, π/2 ;  b, b' = π/4, 3π/4   (Tsirelson alignment)</text>
    <text class="formula" x="10" y="48">S = | E(a,b) + E(a,b') + E(a',b) − E(a',b') |</text>
    <text class="formula" x="10" y="64">classical_bound = 2.0   ·   Tsirelson bound = 2√2 ≈ 2.828</text>
  </g>
  <path class="arrow" d="M 900 651 L 900 662"/>

  <g transform="translate(620, 664)">
    <rect class="stage-hs" x="0" y="0" width="560" height="58" rx="4"/>
    <text class="stage-name" x="10" y="16">twin_quaternion_factoring.coupling — ρ_AB per step</text>
    <text class="formula" x="10" y="32">ρ_AB(t) = 2 · arccos(|q_A(t) · q_B(t)|)   (joint coherence angle)</text>
    <text class="formula" x="10" y="48">coherence_class ∈ {tightly_coupled, loosely_coupled, decoupled}</text>
  </g>
  <path class="arrow" d="M 900 722 L 900 733"/>

  <g transform="translate(620, 735)">
    <rect class="stage-hash" x="0" y="0" width="560" height="58" rx="4"/>
    <text class="stage-name" x="10" y="16">cnq_content_sha256 — determinism contract (independent of CNT)</text>
    <text class="formula" x="10" y="32">SHA-256(canonical-JSON(payload − {volatile fields}))</text>
    <text class="formula" x="10" y="48">cnt_reference is informational metadata only — NOT a hash chain</text>
  </g>

  <text class="subtitle" x="600" y="870" text-anchor="middle">
    Both engines on hci_shared foundation · CNT v3 + CNQ v2 ship anti-specification (SEA) and BIST self-test (STP-1.0) discipline
  </text>
  <text class="subtitle" x="600" y="888" text-anchor="middle">
    Domain wrappers (audio/government_budget/...) translate engine output to localised display — engine itself stays neutral
  </text>

</svg>
