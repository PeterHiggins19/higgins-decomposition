name: Validate Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy scipy pandas

      - name: Verify current engine + tools
        run: |
          echo "=== Current Engine + Tools Check (CN-TT v4) ==="
          missing=0
          for f in \
            "HCI-CNTT/run_cntt.py" \
            "HCI-CNTT/engine/geometry.py" \
            "HCI-CNTT/engine/cntt.py" \
            "HCI-CNTT/engine/codes.py" \
            "HCI-CNTT/engine/navigate.py" \
            "HCI-CNTT/engine/atlas.py" \
            "HCI-CNTT/engine/provenance.py" \
            "HCI-CNTT/engine/self_test/run_self_test.py" \
            "tools/cntt_report.py" \
            "tools/README.md"; do
            if [ -f "$f" ]; then
              size=$(stat --format=%s "$f")
              kb=$((size / 1024))
              echo "  OK: $f (${kb} KB)"
            else
              echo "  MISSING: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "ERROR: $missing current engine/tool file(s) missing"
            exit 1
          fi
          echo "All current engine + tool files present."

      - name: Verify frozen oracle present (archived reference)
        run: |
          echo "=== Frozen Oracle Check ==="
          missing=0
          for f in "HCI-CNT/engine/cnt.py" "HCI-CNQ/engine/cnq.py"; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "ERROR: $missing frozen-oracle file(s) missing"
            exit 1
          fi
          echo "Frozen oracle present."

      - name: Verify control plane files
        run: |
          echo "=== Control Plane Check ==="
          missing=0
          for f in \
            "ai-refresh/HS_MACHINE_MANIFEST.json" \
            "ai-refresh/HS_ADMIN.json" \
            "ai-refresh/HS_SYSTEM_INVENTORY.json" \
            "ai-refresh/HS_GITHUB_CONFIG.json" \
            "HS_FAST_REFRESH.json"; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "ERROR: $missing control plane file(s) missing"
            exit 1
          fi
          echo "All control plane files present."

      - name: Verify root documents
        run: |
          echo "=== Root Documents Check ==="
          for f in README.md EXECUTIVE_SUMMARY.md HS_GUIDE.md CITATION.cff LICENSE .gitignore; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
              exit 1
            fi
          done
          echo "All root documents present."

      - name: Verify reference standards
        run: |
          echo "=== Reference Standards Check ==="
          for f in \
            "docs/reference/Hs_Reference_Standard_Library.md" \
            "docs/reference/Hs_Natural_Pairs_Baseline.md" \
            "experiments/Hs-21_Reference_Standards/Hs-21_reference_library.json" \
            "experiments/Hs-22_Natural_Pairs/Hs-22_pair_library.json"; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
              exit 1
            fi
          done
          echo "All reference standards present."

      - name: Verify experiment results
        run: |
          echo "=== Experiment Results Check ==="
          count=0
          missing=0
          for dir in experiments/Hs-*/; do
            exp=$(basename "$dir")
            result=$(find "$dir" -name "*_results.json" | head -1)
            if [ -n "$result" ]; then
              echo "  OK: $exp"
              count=$((count + 1))
            else
              echo "  MISSING RESULTS: $exp"
              missing=$((missing + 1))
            fi
          done
          echo ""
          echo "Experiments with results: $count"
          echo "Experiments missing results: $missing"
          if [ $missing -gt 5 ]; then
            echo "ERROR: Too many experiments missing results"
            exit 1
          fi

      - name: Run CN-TT v4 engine self-test (BIST)
        run: |
          echo "=== Engine Self-Test (canonical) ==="
          python3 HCI-CNTT/engine/self_test/run_self_test.py

      - name: Run current-tool smoke test (cntt_report)
        run: |
          echo "=== Tool Smoke Test (tools/cntt_report.py) ==="
          printf 't,A,B,C,D\n0,5,3,2,4\n1,6,2,3,3\n2,4,4,1,5\n3,7,1,2,2\n' > /tmp/smoke.csv
          out=$(python3 tools/cntt_report.py /tmp/smoke.csv)
          echo "$out"
          echo "$out" | grep -q "content hash" || { echo "ERROR: cntt_report produced no content hash"; exit 1; }
          echo "Tool smoke test: PASSED"

      - name: Verify JSON integrity
        run: |
          echo "=== JSON Integrity Check ==="
          errors=0
          for jsonfile in $(find . -name '*.json' -not -path './.git/*' | sort); do
            if python3 -c "import json; json.load(open('$jsonfile'))" 2>/dev/null; then
              true  # silent pass
            else
              echo "  INVALID JSON: $jsonfile"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "ERROR: $errors invalid JSON file(s)"
            exit 1
          fi
          echo "All JSON files valid."

      - name: Summary
        run: |
          echo ""
          echo "=========================================="
          echo "  Hˢ Repository Validation: PASSED"
          echo "=========================================="
          echo ""
          echo "  Current engine: CN-TT v4 (HCI-CNTT/)"
          echo "  Engine kernel:  $(wc -l < HCI-CNTT/engine/cntt.py) lines (cntt.py)"
          echo "  Current tool:   tools/cntt_report.py ($(wc -l < tools/cntt_report.py) lines)"
          echo "  Frozen oracle:  HCI-CNT (CNT v3.2.0) + HCI-CNQ (CNQ v2.0.0), archived reference"
          echo "  Experiments:    $(ls -d experiments/Hs-*/ 2>/dev/null | wc -l)"
          echo ""
